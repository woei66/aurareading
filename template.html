<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{$title}</title>
  <meta name="description" content="Aura144 - A fun entertainment app that creates aura-inspired visual effects. For entertainment purposes only." />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Core styles consistent with Home (lite) */
    .glass {
      background: rgba(255, 255, 255, .7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(2, 6, 23, .06);
    }

    .hero-article {
      position: relative;
      overflow: hidden;
      color: #0b1020;
      background:
        radial-gradient(800px 300px at 10% 0%, rgba(124, 58, 237, .18), transparent 55%),
        radial-gradient(800px 300px at 90% 10%, rgba(20, 184, 166, .16), transparent 55%),
        linear-gradient(180deg, #ffffff, #f8fafc);
    }

    .hero-article:after {
      content: "";
      position: absolute;
      inset: -20%;
      filter: blur(30px);
      background:
        radial-gradient(30rem 12rem at 20% 80%, rgba(99, 102, 241, .16), transparent 60%),
        radial-gradient(26rem 12rem at 85% 40%, rgba(16, 185, 129, .12), transparent 60%);
      pointer-events: none;
    }

    .section-title {
      font-weight: 800;
      letter-spacing: .2px;
      background: linear-gradient(90deg, #0f172a, #312e81);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .article-content {
      color: #0f172a;
    }

    .article-content h1 {
      font-size: 2rem;
      line-height: 1.2;
      font-weight: 800;
      margin: 0 0 1rem;
    }

    .article-content h2 {
      font-size: 1.5rem;
      line-height: 1.3;
      font-weight: 700;
      margin: 2rem 0 .75rem;
    }

    .article-content h3 {
      font-size: 1.125rem;
      font-weight: 700;
      margin: 1.25rem 0 .5rem;
    }

    .article-content p {
      margin: .75rem 0;
      line-height: 1.85;
    }

    .article-content ul {
      list-style: disc;
      padding-left: 1.25rem;
      margin: .5rem 0 1rem;
    }

    .article-content ol {
      list-style: decimal;
      padding-left: 1.25rem;
      margin: .5rem 0 1rem;
    }

    .article-content blockquote {
      border-left: 4px solid #a78bfa;
      padding: .5rem 1rem;
      margin: 1rem 0;
      color: #334155;
      background: #f8fafc;
      border-radius: .25rem;
    }

    .toc a {
      color: #334155;
    }

    .toc a:hover {
      color: #4f46e5;
    }

    .soft-card {
      background: linear-gradient(180deg, #ffffff, #fafafa);
      border: 1px solid rgba(15, 23, 42, .06);
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .06);
    }

    .social-link {
      display: inline-flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      background: #0f172a;
      color: #fff;
      border: 1px solid rgba(148, 163, 184, .2);
    }
  </style>
</head>

<body class="antialiased text-slate-800">

  <!-- Header (simple version consistent with Home) -->
  <header class="sticky top-0 z-40 glass">
    <div class="mx-auto max-w-7xl px-5 py-4 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-2 font-extrabold text-xl tracking-tight">
        <span class="inline-block w-3 h-3 rounded-full"
          style="background: radial-gradient(circle at 30% 30%, #10b981, #4f46e5);"></span>
        <span>Aura144</span>
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
        <a href="/index.html#features" class="hover:text-indigo-700">Features</a>
        <a href="/index.html#how" class="hover:text-indigo-700">How it works</a>
        <a href="/support" class="hover:text-indigo-700">Support</a>
      </nav>
    </div>
  </header>

  <!-- Article hero -->
  <section class="hero-article">
    <div class="mx-auto max-w-7xl px-6 py-12">
      <div class="max-w-3xl">
        <p class="text-sm text-slate-600 mb-2">
          <span><!-- Category --></span>
        </p>
        <h1 class="text-4xl font-extrabold tracking-tight mb-3"><!-- Article title --></h1>
        <p class="text-slate-600 max-w-2xl"><!-- 1–2 sentence summary --></p>
        <div class="mt-4 flex items-center gap-5">
          <div class="flex -space-x-2">
            <!-- Replace with author avatar -->
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-teal-400 border-2 border-white"></div>
          </div>
          <div class="text-sm text-slate-600">
            <span><!-- Author --></span> · <time datetime="2026-01-01"><!-- Date --></time>
          </div>
          <div class="ml-auto hidden sm:flex items-center gap-3">

          </div>
        </div>
      </div>
  </section>

  <!-- Main content with TOC -->
   <main class="mx-auto max-w-7xl px-6 py-10">

    <!-- Article content -->
    <article class="article-content max-w-3xl">
      <!-- Article starts: sample structure below; replace for real posts -->
      <h1 id="what">{$title}</h1>
      <p>{$content}</p>
    </article>
  </main>
      © 2026 Aura144. All rights reserved.
    </div>
  </footer>
</body>

</html>

name: App feedback / feature request
description: Share feedback or a feature request for Aura144
title: "[Feedback] "
labels: [feedback]
body:
  - type: input
    id: device
    attributes:
      label: Device / Android version
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug report
        - Feature request
        - App store / listing feedback
        - General
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Details
      description: What happened, or what would you like to see?
    validations:
      required: true
